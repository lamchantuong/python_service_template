[project]
name = "python-service-template"
version = "0.1.0"
description = "CLI + Web + API Python service template"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Compatible release (~=): patch fixes OK, no new minor/major on direct deps (no lockfile).
dependencies = [
    "fastapi~=0.136.0",
    "uvicorn[standard]~=0.48.0",
    "typer~=0.25.0",
    "jinja2~=3.1",
    "python-dotenv~=1.2",
]

[project.scripts]
python-service = "app.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest~=9.0",
    "httpx~=0.28.0",
    "ruff~=0.15.0",
    "mypy~=2.1",
    "pyright~=1.1.409",
]

[build-system]
requires = ["hatchling~=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["app", "main.py", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pyright]
include = ["app", "main.py", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
